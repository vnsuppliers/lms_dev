<link rel="stylesheet" href="https://hrms.cloudifai.com/public/vendor/full-calendar/main.min.css" defer="defer">
<script src="https://code.jquery.com/jquery-1.9.1.js"></script>
<script src="https://hrms.cloudifai.com/public/vendor/full-calendar/main.min.js"></script>
<script src="https://hrms.cloudifai.com/public/vendor/full-calendar/locales-all.min.js"></script>


<div id="calendar"></div>

<script>

            $(document).ready(function () {
                var calendarEl = document.getElementById('calendar');

                var calendar = new FullCalendar.Calendar(calendarEl, {
                   
                    timeZone: 'Asia/Kolkata',
                    firstDay: parseInt("1"),
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,timeGridDay'
                    },
                    navLinks: true, // can click day/week names to navigate views
                    selectable: false,
                    initialView: 'dayGridMonth',
                    selectMirror: true,
                    eventClick: function(arg) {
                         window.location = "{{url('course_view')}}?id=" + arg.event.id;
                        //getEventDetail(arg.event.id,arg.event.extendedProps.event_type);
                    },
                    editable: false,
                    dayMaxEvents: true, // allow "more" link when too many events
                    events: [
                                {
                                    color: "#FF0000",
                                    end: "2024-07-12T12:30:00.000000Z",
                                    id: 1,
                                    start: "2024-07-12T11:30:00.000000Z",
                                    title: "new tasks"
                                },
                                {
                                    color: "#FF0000",
                                    end: "2024-07-12T13:30:00.000000Z",
                                    id: 1,
                                    start: "2024-07-12T12:30:00.000000Z",
                                    title: "new tasks"
                                }
                            ],
                   
                    eventTimeFormat: { // like '14:30:00'
                        hour:  '2-digit' ,
                        minute: '2-digit',
                        meridiem: false
                    }
                });

                if (calendarEl != null) {
                    calendar.render();
                }


            })
        </script>
